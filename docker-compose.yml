services:
  db:
    image: postgres:16
    container_name: budget_tracker_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: budget
      POSTGRES_PASSWORD: budget
      POSTGRES_DB: budget
    ports:
      # host 5433 -> container 5432 to avoid clashing with a local Postgres on 5432
      - "5433:5432"
    volumes:
      - budget_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U budget -d budget"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  budget_pgdata:
